# fly.toml app configuration file generated for achievtrack-frontend on 2026-06-18T16:40:52-06:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'achievtrack-frontend'
primary_region = 'lax'

[build]
  [build.args]
    NEXT_PUBLIC_API_URL = "https://achievtrack-api.fly.dev"

[env]
  NODE_ENV = 'production'
  PORT = '3000'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 500
    soft_limit = 400

[[vm]]
  memory = '512mb'
  cpus = 1
  memory_mb = 512
